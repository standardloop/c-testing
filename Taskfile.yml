---
version: "3"

includes:
  c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # ../taskfiles/c.yml
  # c: ../taskfiles/c.yml

vars:
  DYN_LIBS_USED: "-lstandardloop-logger -lstandardloop-collections -lstandardloop-util"
  TEST_EXECUTABLE_NAME: test
  SOURCE_FILES:
    - testing.c
  TEST_SOURCE_FILES:
    - testing.test.c
  # for releasing
  DYLIB_NAME: libstandardloop-testing.dylib
  DYLIB_HEADER: testing.h

tasks:
  default:
    cmds:
      - task: test

  dependencies:
    aliases:
      - deps
    cmds:
      - task: c:dependencies:logger:latest
      - task: c:dependencies:util:latest
      - task: c:dependencies:collections:latest

  release:
    deps:
      - c:release

  test:build:
    deps:
      - dependencies
    cmds:
      - task: c:test:build

  test:run:
    aliases:
      - test
    deps:
      - test:build
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}

  test:build-sanitize:
    deps:
      - dependencies
    cmds:
      - task: c:test:build-sanitize

  test:run-sanitize:
    aliases:
      - santize
    deps:
      - test:build-sanitize
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}-sanitize

  clean:
    deps:
      - c:test:clean

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs

  test:leaks:
    aliases:
      - leaks
    desc: "Run macOS leaks on the test program."
    deps:
      - test:build
    cmds:
      - cp /usr/local/lib/standardloop/libstandardloop-util.dylib ./
      - cp /usr/local/lib/standardloop/libstandardloop-collections.dylib ./
      - cp /usr/local/lib/standardloop/libstandardloop-logger.dylib ./
      - leaks --atExit -- ./{{.TEST_EXECUTABLE_NAME}}
      - rm libstandardloop-util.dylib
      - rm libstandardloop-collections.dylib
      - rm libstandardloop-logger.dylib
